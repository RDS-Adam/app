<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Prise de mesures</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: barre collante (fiche + statut) puis barre d'outils de croquis ; une colonne "feuille" de 980px max :
   en-tête client, quatre blocs de cases à cocher en grille, puis feuillets de croquis pleine largeur. */
:root{
  --paper:#eceff4; --sheet:#ffffff; --ink:#17202c; --muted:#5b6676; --line:#d3d9e2; --line-strong:#9ba7b7;
  --pen:#1f3fa6; --pen-soft:#e4eafa; --pen-ink:#ffffff; --ok:#1c7a4b; --warn:#a4520b; --danger:#b42318; --danger-soft:#fbe9e7;
  --shadow:0 1px 2px rgba(18,28,48,.06),0 6px 18px rgba(18,28,48,.06);
  --f-display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-hand:'Caveat','Segoe Print','Bradley Hand',cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1218; --sheet:#161b23; --ink:#e5e9f0; --muted:#9aa5b5; --line:#2a323e; --line-strong:#4a5566;
  --pen:#93abff; --pen-soft:#1d2742; --pen-ink:#0e1218; --ok:#5fcf97; --warn:#f0a35a; --danger:#ff8a7a; --danger-soft:#3a1d1a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1218; --sheet:#161b23; --ink:#e5e9f0; --muted:#9aa5b5; --line:#2a323e; --line-strong:#4a5566;
  --pen:#93abff; --pen-soft:#1d2742; --pen-ink:#0e1218; --ok:#5fcf97; --warn:#f0a35a; --danger:#ff8a7a; --danger-soft:#3a1d1a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--sheet)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Barre du haut */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--sheet);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.02em;text-transform:uppercase}
.brand span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--sheet);border-radius:9px;padding:8px 12px;font-weight:600;font-size:14px;min-height:40px}
.btn:hover{border-color:var(--line-strong)}
.btn.primary{background:var(--pen);color:var(--pen-ink);border-color:var(--pen)}
.btn.icon{padding:8px;width:40px;justify-content:center}
.btn svg{width:19px;height:19px;flex:none}
.btn[disabled]{opacity:.55;cursor:default}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.status[data-s="saved"] i{background:var(--ok)}
.status[data-s="saving"] i,.status[data-s="dirty"] i{background:var(--pen)}
.status[data-s="offline"] i,.status[data-s="full"] i{background:var(--warn)}
.status[data-s="offline"],.status[data-s="full"]{color:var(--warn)}
@media (max-width:640px){.hide-sm{display:none!important}.status b{display:none}}

/* Feuille */
main{padding-block:18px 60px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:12px;padding:14px 18px 6px;border-bottom:1px dashed var(--line)}
.sheet-head .ver{font-size:11.5px;color:var(--muted)}
.sheet-head h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(20px,3.4vw,28px);letter-spacing:.04em;text-align:center;text-wrap:balance}
.sheet-head .who{display:grid;gap:4px;justify-self:end;min-width:0}
@media (max-width:640px){.sheet-head{grid-template-columns:1fr}.sheet-head h1{text-align:left;order:-1}.sheet-head .who{justify-self:stretch}}

.fld{display:flex;align-items:baseline;gap:8px;min-width:0}
.fld label{font-family:var(--f-display);font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.fld.sm label{font-family:var(--f-body);font-weight:500;font-size:12px;letter-spacing:0;text-transform:none;color:var(--muted)}
.fld input{flex:1;min-width:0;border:0;border-bottom:1.5px dotted var(--line-strong);background:transparent;color:var(--pen);font:600 17px/1.3 var(--f-body);padding:4px 2px}
.fld.sm input{font-size:15px;padding:2px}
.fld input:focus{outline:none;border-bottom:1.5px solid var(--pen)}
.fld input::placeholder{color:var(--line-strong);font-weight:400}
.idgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px 22px;padding:16px 18px 18px}
.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}.c8{grid-column:span 8}
@media (max-width:760px){.c6,.c4,.c3,.c8{grid-column:span 12}}

.tva{display:flex;align-items:center;gap:10px}
.blocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
.block{padding:14px 18px 18px;border-bottom:1px solid var(--line);min-width:0}
.block:nth-child(odd){border-right:1px solid var(--line)}
@media (max-width:760px){.blocks{grid-template-columns:1fr}.block:nth-child(odd){border-right:0}}
.block h2{margin:0 0 10px;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.block h3{margin:12px 0 6px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.block h3:first-of-type{margin-top:0}
.chks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.chks.one{grid-template-columns:1fr}
.row{display:flex;gap:6px;align-items:stretch;min-width:0}
.row .chk{flex:1}
.chk{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:6px 6px 6px 11px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);text-align:left;min-width:0}
.chk span{min-width:0}
.chk .box{flex:none;width:30px;height:30px;border:1.5px solid var(--line-strong);border-radius:5px;display:grid;place-items:center;background:var(--sheet)}
.chk .box svg{width:24px;height:24px;opacity:0;transform:scale(.6);transition:transform .12s,opacity .12s}
.chk[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft)}
.chk[aria-pressed="true"] .box{border-color:var(--pen)}
.chk[aria-pressed="true"] .box svg{opacity:1;transform:none}
.unit{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:0 8px;width:96px;flex:none}
.unit input{width:100%;min-width:0;border:0;background:transparent;color:var(--pen);font:600 16px var(--f-body);padding:8px 0;text-align:right}
.unit input:focus{outline:none}
.unit em{font-style:normal;color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:6px 10px;align-items:center}
.kv>label{font-size:14px}
.kv .unit{width:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:9px 4px;font-weight:600;font-size:14px;min-height:40px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--pen);color:var(--pen-ink)}
@media (max-width:420px){.kv{grid-template-columns:minmax(0,1fr) 128px}}

/* Croquis */
.sk-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:22px 2px 8px}
.sk-title h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:.05em;text-transform:uppercase}
.sk-title p{margin:0;color:var(--muted);font-size:13px}
.tools{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--topH,61px));z-index:20;background:var(--sheet);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.tools-in{display:flex;align-items:center;gap:4px;padding:6px;overflow-x:auto;scrollbar-width:thin}
.tb{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:48px;height:48px;border:1px solid transparent;border-radius:8px;background:transparent;padding:4px 6px;font-size:10.5px;font-weight:600;color:var(--muted)}
.tb svg{width:22px;height:22px;color:var(--ink)}
.tb:hover{background:var(--paper)}
.tb[aria-pressed="true"]{background:var(--pen-soft);border-color:var(--pen);color:var(--pen)}
.tb[aria-pressed="true"] svg{color:var(--pen)}
.tb[disabled]{opacity:.4;cursor:default}
.sep{flex:none;width:1px;height:32px;background:var(--line);margin:0 4px}
.sw{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--sheet);box-shadow:0 0 0 1px var(--line-strong);margin:0 2px}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--ink)}
.wd{flex:none;width:36px;height:36px;border-radius:8px;border:1px solid transparent;background:transparent;display:grid;place-items:center}
.wd i{display:block;width:20px;border-radius:9px;background:var(--ink)}
.wd[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft)}
.toggle{flex:none;display:flex;align-items:center;gap:8px;padding:0 8px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;border:0;background:transparent;height:44px}
.toggle i{width:34px;height:20px;border-radius:12px;background:var(--line-strong);position:relative;transition:background .15s}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--sheet);transition:transform .15s}
.toggle[aria-pressed="true"]{color:var(--pen)}
.toggle[aria-pressed="true"] i{background:var(--pen)}
.toggle[aria-pressed="true"] i::after{transform:translateX(14px)}

.pages{display:grid;gap:18px;margin-top:14px}
.pg-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line)}
.pg-head b{font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.pg-head .btn{min-height:34px;padding:5px 10px;font-size:13px}
.pg-head .btn.danger{color:var(--danger)}
.pg-head .btn.confirm{background:var(--danger);border-color:var(--danger);color:#fff}
.cvw{position:relative;line-height:0;border-radius:0 0 6px 6px;overflow:hidden}
canvas.cv{display:block;width:100%;aspect-ratio:1000/900;max-width:100%;touch-action:none;background:#fff;cursor:crosshair}
body.scroll-ok canvas.cv{touch-action:pan-x pan-y pinch-zoom}
body[data-tool="hand"] canvas.cv{cursor:grab}
body[data-tool="select"] canvas.cv{cursor:default}
body[data-tool="text"] canvas.cv{cursor:text}
.ov{position:absolute;inset:0;pointer-events:none;line-height:1.2}
.ov>*{pointer-events:auto}
.selbar{position:absolute;display:flex;gap:4px;transform:translateY(-100%)}
.selbar button{display:inline-flex;align-items:center;gap:5px;border:0;border-radius:7px;padding:6px 9px;font-size:12.5px;font-weight:700;background:#17202c;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.selbar button.del{background:#b42318}
.selbar svg{width:15px;height:15px}
.txt-edit{position:absolute;min-width:160px;border:1.5px dashed #1f6feb;background:rgba(255,255,255,.92);padding:0 4px;resize:none;overflow:hidden;font-family:var(--f-hand);line-height:1.1;color:#1d3fa8;outline:none;border-radius:4px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
.photobar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.photobar label.btn{cursor:pointer;min-height:46px;padding:10px 14px}
.photobar .hint{color:var(--muted);font-size:13px;flex:1 1 220px;min-width:0}
label.tb{cursor:pointer}
.addpage{width:100%;margin-top:14px;justify-content:center;border-style:dashed;min-height:52px;color:var(--muted)}
.drop{outline:3px dashed var(--pen);outline-offset:-6px}

/* Tiroir des fiches */
.scrim{position:fixed;inset:0;background:rgba(10,16,26,.38);z-index:50}
.drawer{position:fixed;inset:0 auto 0 0;width:min(400px,92vw);z-index:51;background:var(--sheet);border-right:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);box-shadow:var(--shadow)}
.drawer header{display:flex;align-items:center;gap:8px;padding:14px 14px 10px}
.drawer header b{flex:1;font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:.05em;text-transform:uppercase}
.drawer .search{margin:0 14px 10px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--paper);color:var(--ink);font:inherit}
.list{flex:1;overflow-y:auto;padding:0 8px 16px}
.item{display:flex;gap:6px;align-items:stretch;border-radius:9px}
.item.on{background:var(--pen-soft)}
.item .open{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:10px 8px;border-radius:9px}
.item .open:hover{background:var(--paper)}
.item.on .open:hover{background:transparent}
.item .open b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .open span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .x{flex:none;border:0;background:transparent;color:var(--muted);border-radius:8px;padding:0 10px;font-size:12px;font-weight:700}
.item .x svg{width:17px;height:17px}
.item .x.confirm{background:var(--danger);color:#fff}
.empty{padding:24px 14px;color:var(--muted);font-size:14px}
.mode{margin:0 14px 12px;font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:#17202c;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top" id="top">
  <div class="wrap">
    <button class="btn icon" id="bList" aria-label="Mes fiches" title="Mes fiches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="brand"><b>Prise mesures</b><span id="subTitle">Nouvelle fiche</span></div>
    <span class="status" id="status" data-s="idle"><i></i><b id="statusTxt">Prêt</b></span>
    <button class="btn" id="bNew" title="Nouvelle fiche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="hide-sm">Nouvelle</span></button>
    <button class="btn primary" id="bPdf" title="Exporter en PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>PDF</button>
  </div>
</header>

<main class="wrap">
  <section class="sheet" aria-label="Fiche de prise de mesures">
    <div class="sheet-head">
      <div class="ver">version doc : 12/07/2021</div>
      <h1>PRISE MESURES</h1>
      <div class="who">
        <div class="fld sm"><label for="f-metreur">Nom métreur</label><input id="f-metreur" data-f="metreur" autocomplete="off" placeholder="Votre nom"></div>
        <div class="fld sm"><label for="f-temps">Temps estimé</label><input id="f-temps" data-f="temps" autocomplete="off" placeholder="ex. 1h30"></div>
      </div>
    </div>
    <div class="idgrid">
      <div class="fld c6"><label for="f-client">Nom client</label><input id="f-client" data-f="client" autocomplete="off" placeholder="M. et Mme …"></div>
      <div class="fld c3"><label for="f-tel">Tél</label><input id="f-tel" data-f="tel" type="tel" inputmode="tel" autocomplete="off"></div>
      <div class="fld c3"><label for="f-date">Date</label><input id="f-date" data-f="date" type="date"></div>
      <div class="fld c8"><label for="f-adresse">Adresse</label><input id="f-adresse" data-f="adresse" autocomplete="off"></div>
      <div class="fld c4"><label for="f-codePorte">Code porte</label><input id="f-codePorte" data-f="codePorte" autocomplete="off"></div>
      <div class="fld c8"><label for="f-chantier">Chantier</label><input id="f-chantier" data-f="chantier" autocomplete="off" placeholder="Ville / lieu du chantier"></div>
      <div class="c4 tva"><button class="chk" style="flex:1" data-c="tva10" aria-pressed="false" id="c-tva10"><span><b>TVA 10 %</b></span><i class="box"></i></button></div>
    </div>
    <div class="blocks" id="blocks"></div>
  </section>

  <div class="sk-title"><h2>Croquis &amp; notes</h2><p class="hide-sm">Écrivez au stylet ou au doigt, insérez des photos, ajoutez flèches et cotes.</p></div>
  <div class="photobar"><label class="btn primary" for="inCam" role="button" tabindex="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Prendre une photo</label><label class="btn" for="inGal" role="button" tabindex="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="1.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="M21 16l-5-5-9 8"/></svg>Ajouter des photos</label><span class="hint">Vous pouvez en choisir plusieurs à la fois. Glisser-déposer et coller marchent aussi.</span></div>
  <div class="tools" id="tools"><div class="tools-in" id="toolsIn"></div></div>
  <div class="pages" id="pages"></div>
  <button class="btn addpage" id="bAddPage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Ajouter un feuillet</button>
  <input type="file" id="inCam" class="vh" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
  <input type="file" id="inGal" class="vh" accept="image/*" multiple tabindex="-1" aria-hidden="true">
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Mes fiches">
  <header><b>Mes fiches</b><button class="btn" id="bNew2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nouvelle</button><button class="btn icon" id="bClose" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <input class="search" id="search" type="search" placeholder="Rechercher un client, une ville…" aria-label="Rechercher">
  <p class="mode" id="modeTxt"></p>
  <div class="list" id="list"></div>
</aside>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
'use strict';
const W = 1000, H = 900;
const $ = (s, r = document) => r.querySelector(s);
const uid = (p = '') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const LS = {
  get(k){ try { const v = localStorage.getItem(k); return v == null ? null : JSON.parse(v); } catch { return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k){ try { localStorage.removeItem(k); } catch {} },
  keys(p){ try { return Object.keys(localStorage).filter(k => k.startsWith(p)); } catch { return []; } }
};
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };

/* ---------- Stockage ---------- */
const S = { mode: 'local', db: null, assets: null, dl: null, inViewer: !!(window.claude && window.claude.use) };
async function initCaps(){
  if (!S.inViewer) return;
  const tm = () => new Promise(r => setTimeout(() => r(null), 10000));
  const get = n => Promise.race([Promise.resolve().then(() => window.claude.use(n)).catch(() => null), tm()]);
  const [db, as, dl] = await Promise.all([get('db'), get('assets'), get('downloads')]);
  S.db = db; S.assets = as; S.dl = dl; S.mode = db ? 'db' : 'local';
}
const ser = objs => JSON.stringify(objs.map(o => { const c = {}; for (const k in o) if (k[0] !== '_') c[k] = o[k]; if (o.t === 'i' && !o.assetId && o._data) c.d = o._data; return c; }));
const deser = js => { let a = []; try { a = typeof js === 'string' ? JSON.parse(js) : (js || []); } catch {} return a.map(o => { if (o.d){ o._data = o.d; delete o.d; } return o; }); };
const cleanF = f => JSON.parse(JSON.stringify(f));
const summary = f => ({ id: f.id, client: f.client || '', chantier: f.chantier || '', date: f.date || '', metreur: f.metreur || '', updatedAt: f.updatedAt || 0 });

const DB = {
  listen(cb){
    let t = setTimeout(() => cb(null), 10000);
    return S.db.collection('fiches').orderBy('updatedAt', 'desc').limit(500).onSnapshot(
      s => { clearTimeout(t); cb(s.docs.map(d => Object.assign({}, d.data(), { id: d.id }))); },
      () => { clearTimeout(t); cb(null); });
  },
  async load(id){
    const s = await S.db.doc('fiches/' + id).get(); if (!s.exists) return null;
    const f = Object.assign({}, s.data(), { id });
    const pages = await Promise.all((f.pageIds || []).map(async pid => {
      const ps = await S.db.doc(`fiches/${id}/pages/${pid}`).get();
      const pg = { id: pid, objs: [] };
      if (ps.exists){ const d = ps.data(); let js = d.objs;
        if (d.jsonAsset){ pg._jsonAsset = d.jsonAsset; js = await (await fetch('/_blob/' + d.jsonAsset)).text(); }
        pg.objs = deser(js); }
      return pg;
    }));
    return { f, pages };
  },
  async saveFiche(f){ await S.db.doc('fiches/' + f.id).set(cleanF(f)); },
  async savePage(fid, pg){
    const js = ser(pg.objs), ref = S.db.doc(`fiches/${fid}/pages/${pg.id}`);
    if (js.length < 230000 || !S.assets){
      await ref.set({ objs: js, updatedAt: Date.now() });
      if (pg._jsonAsset){ S.assets && S.assets.delete(pg._jsonAsset).catch(() => {}); pg._jsonAsset = null; }
    } else {
      const r = await S.assets.upload(new Blob([js], { type: 'application/json' }));
      const old = pg._jsonAsset; pg._jsonAsset = r.id;
      await ref.set({ jsonAsset: r.id, updatedAt: Date.now() });
      if (old) S.assets.delete(old).catch(() => {});
    }
  },
  async delPage(fid, pg){
    await S.db.doc(`fiches/${fid}/pages/${pg.id}`).delete();
    if (S.assets){ for (const o of pg.objs) if (o.t === 'i' && o.assetId) S.assets.delete(o.assetId).catch(() => {});
      if (pg._jsonAsset) S.assets.delete(pg._jsonAsset).catch(() => {}); }
  },
  async delFiche(id){
    const d = await DB.load(id).catch(() => null);
    if (d) for (const pg of d.pages) await DB.delPage(id, pg).catch(() => {});
    await S.db.doc('fiches/' + id).delete();
  }
};
const LOC = {
  list(){ return LS.keys('pm2:f:').map(k => LS.get(k)).filter(Boolean).sort((a, b) => b.updatedAt - a.updatedAt); },
  load(id){ const f = LS.get('pm2:f:' + id); if (!f) return null;
    return { f, pages: (f.pageIds || []).map(pid => ({ id: pid, objs: deser(LS.get(`pm2:p:${id}:${pid}`) || '[]') })) }; },
  saveFiche(f){ if (!LS.set('pm2:f:' + f.id, cleanF(f))) throw { code: 'quota' }; },
  savePage(fid, pg){ if (!LS.set(`pm2:p:${fid}:${pg.id}`, ser(pg.objs))) throw { code: 'quota' }; },
  delPage(fid, pg){ LS.del(`pm2:p:${fid}:${pg.id}`); },
  delFiche(id){ const f = LS.get('pm2:f:' + id); (f?.pageIds || []).forEach(pid => LS.del(`pm2:p:${id}:${pid}`)); LS.del('pm2:f:' + id); }
};
const store = () => S.mode === 'db' ? DB : LOC;

function dataToBlob(d){ const [h, b] = d.split(','); const bin = atob(b); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type: h.match(/:(.*?);/)[1] }); }
async function ensureUploads(pgs, onChange){
  if (!S.assets) return true;
  let ok = true;
  for (const pg of pgs) for (const o of pg.objs) if (o.t === 'i' && !o.assetId && o._data){
    try { const r = await S.assets.upload(dataToBlob(o._data));
      const e = imgCache.get(o._data); if (e) imgCache.set(r.id, e);
      o.assetId = r.id; delete o._data; onChange && onChange(pg);
    } catch { ok = false; }
  }
  return ok;
}

/* ---------- État courant + sauvegarde ---------- */
let cur = null, pages = [], fiches = [], fichesReady = false, untouched = true, autoOpened = false;
let fieldsDirty = false; const dirty = new Set();
let saveTimer = null, saving = false, again = false, retryTimer = null;

function setStatus(s){
  const m = { idle:'Prêt', dirty:'Modifié', saving:'Enregistrement…', saved: S.mode === 'db' ? 'Enregistré' : 'Enregistré sur cet appareil',
    offline:'Hors ligne · copie gardée sur l\'appareil', full:'Mémoire de l\'appareil pleine' };
  $('#status').dataset.s = s; $('#statusTxt').textContent = m[s] || s; $('#status').title = m[s] || s;
}
function touch(){ untouched = false; fieldsDirty = true; setStatus('dirty'); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 900); }
function markPage(pg){ dirty.add(pg.id); touch(); }

async function flush(){
  if (!cur) return;
  if (saving){ again = true; return; }
  if (!fieldsDirty && !dirty.size) return;
  clearTimeout(saveTimer); saving = true; setStatus('saving');
  const f = cur, pgs = pages, toSave = [...dirty]; dirty.clear(); fieldsDirty = false;
  try {
    f.updatedAt = Date.now(); f.pageIds = pgs.map(p => p.id);
    if (S.mode === 'db'){
      const ok = await ensureUploads(pgs.filter(p => toSave.includes(p.id)));
      if (!ok) throw { code: 'upload' };
    }
    for (const pid of toSave){ const pg = pgs.find(p => p.id === pid); if (pg) await store().savePage(f.id, pg); }
    await store().saveFiche(f);
    if (S.mode === 'db') LS.del('pm2:bk:' + f.id);
    LS.set('pm2:last', f.id);
    if (S.mode === 'local'){ fiches = LOC.list(); renderList(); }
    setStatus('saved');
  } catch (e) {
    toSave.forEach(id => dirty.add(id)); fieldsDirty = true;
    if (S.mode === 'db'){
      LS.set('pm2:bk:' + f.id, { f: cleanF(f), pages: pgs.map(p => ({ id: p.id, js: ser(p.objs) })) });
      setStatus('offline'); clearTimeout(retryTimer); retryTimer = setTimeout(flush, 15000);
    } else setStatus('full');
  }
  saving = false;
  if (again){ again = false; flush(); }
}
async function restoreBackups(){
  if (S.mode !== 'db') return;
  for (const k of LS.keys('pm2:bk:')){
    const bk = LS.get(k); if (!bk || !bk.f) { LS.del(k); continue; }
    if (cur && cur.id === bk.f.id) continue;
    try { const pgs = bk.pages.map(p => ({ id: p.id, objs: deser(p.js) }));
      if (!(await ensureUploads(pgs))) continue;
      for (const pg of pgs) await DB.savePage(bk.f.id, pg);
      await DB.saveFiche(bk.f); LS.del(k);
    } catch {}
  }
}

function setCurrent(f, pgs, fromBackup){
  cur = normFiche(f);
  pages = pgs.length ? pgs : [{ id: uid('p'), objs: [] }];
  cur.pageIds = pages.map(p => p.id);
  undoS.length = 0; redoS.length = 0; sel = null; activePage = pages[0]; updUndo();
  fillForm(); buildPages();
  LS.set('pm2:last', cur.id);
  if (fromBackup){ pages.forEach(p => dirty.add(p.id)); touch(); } else setStatus(S.mode === 'db' || LS.get('pm2:f:' + cur.id) ? 'saved' : 'idle');
  renderList();
}
async function openFiche(id){
  if (cur && cur.id === id) { closeDrawer(); return; }
  await flush();
  let data = null, fromBk = false;
  if (S.mode === 'db'){ const bk = LS.get('pm2:bk:' + id); if (bk) { data = { f: bk.f, pages: bk.pages.map(p => ({ id: p.id, objs: deser(p.js) })) }; fromBk = true; } }
  if (!data){ setStatus('saving'); try { data = await store().load(id); } catch { data = null; } }
  if (!data){ toast('Impossible d\'ouvrir cette fiche. Vérifiez la connexion puis réessayez.'); setStatus('idle'); return; }
  untouched = false; setCurrent(data.f, data.pages, fromBk); closeDrawer(); window.scrollTo({ top: 0 });
}
async function newFiche(){
  await flush();
  autoOpened = true; untouched = true; setCurrent(blankFiche(), [], false); setStatus('idle'); closeDrawer(); window.scrollTo({ top: 0 });

function renderList(){
  const q = $('#search').value.trim().toLowerCase();
  let list = fiches.slice();
  if (cur && !list.some(x => x.id === cur.id) && !untouched) list.unshift(summary(cur));
  if (q) list = list.filter(x => [x.client, x.chantier, x.metreur].join(' ').toLowerCase().includes(q));
  const el = $('#list');
  if (!fichesReady){ el.innerHTML = '<p class="empty">Chargement des fiches…</p>'; return; }
  if (!list.length){ el.innerHTML = `<p class="empty">${q ? 'Aucune fiche ne correspond.' : 'Aucune fiche enregistrée. Remplissez la fiche ouverte : elle s\'enregistre toute seule et apparaîtra ici.'}</p>`; return; }
  el.innerHTML = '';
  for (const x of list){
    const d = document.createElement('div'); d.className = 'item' + (cur && cur.id === x.id ? ' on' : '');
    const o = document.createElement('button'); o.className = 'open';
    const b = document.createElement('b'); b.textContent = x.client || 'Client sans nom';
    const s = document.createElement('span'); s.textContent = [x.chantier, frDate(x.date), x.metreur].filter(Boolean).join(' · ') || '—';
    o.append(b, s); o.onclick = () => openFiche(x.id);
    const del = document.createElement('button'); del.className = 'x' + (confirmDel === x.id ? ' confirm' : '');
    del.innerHTML = confirmDel === x.id ? 'Supprimer ?' : svg('trash'); del.setAttribute('aria-label', 'Supprimer la fiche');
    del.onclick = async () => {
      if (confirmDel !== x.id){ confirmDel = x.id; renderList(); setTimeout(() => { if (confirmDel === x.id){ confirmDel = null; renderList(); } }, 4000); return; }
      confirmDel = null;
      try { await store().delFiche(x.id); } catch { toast('La suppression a échoué. Réessayez.'); return; }
      LS.del('pm2:bk:' + x.id);
      if (S.mode === 'local') fiches = LOC.list();
      if (cur && cur.id === x.id){ untouched = true; setCurrent(blankFiche(), [], false); setStatus('idle'); }
      renderList(); toast('Fiche supprimée');
    };
    d.append(o, del); el.append(d);
  }
}

/* ---------- Photos ---------- */
function loadImage(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function fileToData(file, max){
  const url = URL.createObjectURL(file);
  try { let img;
    try { img = await loadImage(url); }
    catch { if (!window.createImageBitmap) throw 0; const bm = await createImageBitmap(file); img = { naturalWidth: bm.width, naturalHeight: bm.height, bm }; }
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img.bm || img, 0, 0, c.width, c.height);
    return { data: c.toDataURL('image/jpeg', S.assets ? .82 : .7), w: c.width, h: c.height };
  } finally { URL.revokeObjectURL(url); }
}
function visiblePage(){
  let best = pages[0], bd = Infinity; const mid = innerHeight / 2;
  for (const pg of pages){ const r = pg._cv.getBoundingClientRect(); const d = Math.abs((r.top + r.bottom) / 2 - mid); if (r.bottom > 0 && r.top < innerHeight && d < bd){ bd = d; best = pg; } }
  return best;
}
async function insertPhotos(files){
  files = files.filter(f => !f.type || f.type.startsWith('image/') || /\.(jpe?g|png|webp|gif|heic|heif)$/i.test(f.name));
  if (!files.length) return;
  commitEditor();
  let pg = (activePage && pages.includes(activePage)) ? activePage : visiblePage();
  toast(files.length > 1 ? `Ajout de ${files.length} photos…` : 'Ajout de la photo…');
  const ds = []; let fail = 0;
  for (const file of files){ try { ds.push(await fileToData(file, S.assets ? 1600 : 1100)); } catch { fail++; } }
  if (!ds.length){ toast('Cette image n\'a pas pu être lue. Les photos HEIC de l\'iPhone passent mieux en JPEG (Réglages › Appareil photo › Formats › Le plus compatible).'); return; }
  const PER = 6; let last = null, firstPg = pg;
  for (let start = 0; start < ds.length; start += PER){
    const grp = ds.slice(start, start + PER);
    if (start > 0){ pg = { id: uid('p'), objs: [] }; pages.push(pg); cur.pageIds = pages.map(p => p.id); buildPages(); markPage(pg); }
    snap(pg);
    const n = grp.length, cols = n === 1 ? 1 : n <= 4 ? 2 : 3, rows = Math.ceil(n / cols), gap = 20;
    const cw = n === 1 ? 560 : (W - 40 - (cols - 1) * gap) / cols, ch = n === 1 ? 520 : (H - 40 - (rows - 1) * gap) / rows;
    grp.forEach((r, i) => {
      const k = Math.min(cw / r.w, ch / r.h, 1.5), w = r.w * k, h = r.h * k;
      let x, y;
      if (n === 1){ const off = pg.objs.filter(o => o.t === 'i').length % 5 * 30; x = (W - w) / 2 + off; y = Math.max(10, (H - h) / 2 + off); }
      else { const c = i % cols, rr = Math.floor(i / cols); x = 20 + c * (cw + gap) + (cw - w) / 2; y = 20 + rr * (ch + gap) + (ch - h) / 2; }
      const o = { t: 'i', x, y, w2: w, h, _data: r.data }; pg.objs.push(o); last = { pg, o };
    });
    changed(pg);
  }
  setTool('select');
  if (ds.length === 1 && last) setSel(last);
  firstPg._cv.scrollIntoView({ behavior: 'smooth', block: 'center' });
  const extra = ds.length > PER ? ` Réparties sur ${Math.ceil(ds.length / PER)} feuillets.` : '';
  toast((ds.length > 1 ? `${ds.length} photos ajoutées.` + extra : 'Photo ajoutée.') + (fail ? ` ${fail} image(s) illisible(s).` : '') + ' Touchez une photo pour la déplacer ou la redimensionner.');
}
$('#inCam').onchange = e => { insertPhotos([...e.target.files]); e.target.value = ''; };
$('#inGal').onchange = e => { insertPhotos([...e.target.files]); e.target.value = ''; };
document.addEventListener('paste', e => { if (e.target.closest('input,textarea')) return; const f = [...(e.clipboardData?.files || [])].filter(x => x.type.startsWith('image/')); if (f.length){ e.preventDefault(); insertPhotos(f); } });
document.addEventListener('keydown', e => {
  const lab = e.target.closest && e.target.closest('label[for]');
  if (lab && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); document.getElementById(lab.htmlFor).click(); return; }

async function sketchImage(pg){

  const s = 1.9, c = document.createElement('canvas'); c.width = W * s; c.height = H * s;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.setTransform(s, 0, 0, s, 0, 0);
  drawGrid(x, true); for (const o of pg.objs) drawObj(x, o);
  try { return c.toDataURL('image/jpeg', .86); }
  catch { x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.setTransform(s, 0, 0, s, 0, 0); drawGrid(x, true);
    for (const o of pg.objs) if (o.t !== 'i') drawObj(x, o); toast('Une photo n\'a pas pu être incluse dans le PDF.'); return c.toDataURL('image/jpeg', .86); }
}

async function exportPDF(){
  if (!window.jspdf){ toast('Le module PDF n\'a pas pu se charger. Vérifiez la connexion puis réessayez.'); return; }
  commitEditor(); const b = $('#bPdf'); b.disabled = true; const old = b.innerHTML; b.innerHTML = 'Création…';
  try {
    await flush(); try { await document.fonts.load(`600 40px ${HAND}`); await document.fonts.load(`700 40px ${HAND}`); } catch {}
    const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
    drawFormPDF(doc, cur);
    const n = pages.length;
    for (let i = 0; i < n; i++){
      const img = await sketchImage(pages[i]);
      if (i === 0){ doc.addImage(img, 'JPEG', 10, 102, 190, 171); doc.setDrawColor(200, 206, 216); doc.setLineWidth(.2); doc.rect(10, 102, 190, 171); }
      else { doc.addPage(); doc.setTextColor(0, 0, 0); doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.text('PRISE MESURES', 10, 14);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.text([cur.client, cur.chantier, frDate(cur.date)].filter(Boolean).join(' · ') + `  —  feuillet ${i + 1}/${n}`, 52, 14);
        doc.addImage(img, 'JPEG', 10, 20, 190, 171); doc.setDrawColor(200, 206, 216); doc.setLineWidth(.2); doc.rect(10, 20, 190, 171); }
      doc.setTextColor(120, 120, 120); doc.setFont('helvetica', 'normal'); doc.setFontSize(7); doc.text(`${i + 1}/${n}`, 200, 290, { align: 'right' });
    }
    const slug = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const name = ['Prise-mesures', slug(cur.client) || 'client', slug(cur.chantier), cur.date].filter(Boolean).join('_') + '.pdf';
    await saveFile(name, doc.output('blob'));
  } catch (e) { toast('Le PDF n\'a pas pu être créé.'); }
  finally { b.disabled = false; b.innerHTML = old; }
}
async function saveFile(name, blob){
  if (S.dl){
    try { await S.dl.save({ filename: name, data: blob }); toast('PDF enregistré : ' + name); }
    catch (e) { toast(e && e.code === 'declined' ? 'Téléchargement annulé.' : 'Le PDF n\'a pas pu être enregistré (' + ((e && e.code) || 'erreur') + ').'); }
    return;
  }
  if (!S.inViewer){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); return; }
  toast('Le téléchargement n\'est pas disponible dans cette vue.');
}
