<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning de la journée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --rds-bleu: #25737d;
    --rds-orange: #ff7200;
    --bg: #fafafa;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #8a8a8a;
    --border: #eeeeee;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Poppins', sans-serif;
    background-color: var(--bg);
    background-image: radial-gradient(circle, rgba(0,0,0,0.08) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--text);
    margin: 0;
    padding: 20px 16px;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    width: 100%;
    max-width: 760px;
    background: var(--card);
    padding: 32px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
  }
  .header { border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 28px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .logo-text { font-weight: 500; font-size: 1.05rem; text-transform: uppercase; letter-spacing: 2px; }
  .logo-text span { color: var(--rds-orange); }
  .sub { font-size: 0.7rem; color: #bbb; }

  h3 { font-size: 0.7rem; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; letter-spacing: 1px; font-weight: 500; }
  label.lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 6px; }

  input, select {
    width: 100%; padding: 9px 0; border: none; border-bottom: 1px solid var(--border);
    font-size: 0.95rem; outline: none; background: transparent; font-family: inherit; color: var(--text);
  }
  input:focus { border-bottom-color: var(--rds-orange); }

  /* Mode */
  .mode { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); margin-bottom: 24px; }
  .mode button {
    background: transparent; border: none; padding: 12px 8px; font-family: inherit; font-size: 0.8rem;
    cursor: pointer; color: var(--muted); transition: all .2s;
  }
  .mode button.active { background: var(--rds-bleu); color: #fff; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 28px; }
  input[type=time] { font-size: 1.4rem; font-weight: 300; }

  /* Steps */
  .steps { margin-bottom: 12px; }
  .step {
    display: grid; grid-template-columns: 28px 1fr 110px 72px; gap: 10px; align-items: center;
    padding: 6px 0; border-bottom: 1px solid var(--border);
  }
  .step .num { font-size: 0.75rem; color: var(--rds-orange); font-weight: 600; text-align: center; }
  .step input.dur { text-align: right; }
  .step .ctrl { display: flex; gap: 2px; justify-content: flex-end; }
  .icon-btn {
    background: transparent; border: none; cursor: pointer; color: #bbb; font-size: 0.95rem;
    width: 22px; height: 28px; padding: 0; line-height: 1; font-family: inherit;
  }
  .icon-btn:hover { color: var(--rds-orange); }
  .icon-btn:disabled { opacity: .3; cursor: default; color: #bbb; }
  .dur-hint { font-size: 0.65rem; color: #bbb; margin: 4px 0 0; }

  .row-actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0 28px; }
  .btn {
    background: transparent; border: 1px solid var(--border); padding: 10px 16px; cursor: pointer;
    font-family: inherit; font-size: 0.78rem; color: var(--text); transition: all .2s;
  }
  .btn:hover { border-color: var(--rds-orange); color: var(--rds-orange); }
  .btn.primary { border-color: var(--rds-orange); color: var(--rds-orange); }

  /* Result */
  .result {
    background: var(--rds-bleu); color: #fff; padding: 22px 24px; margin-bottom: 22px;
    display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .result .big { font-size: 2.6rem; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; }
  .result .cap { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; opacity: .8; margin-bottom: 6px; }
  .result .side { text-align: right; font-size: 0.8rem; opacity: .95; }
  .result .side b { font-weight: 600; }
  .warn { color: #ffd2ad; font-size: 0.72rem; margin-top: 4px; }

  /* Timeline */
  .timeline { margin: 0 0 28px; padding: 0; list-style: none; }
  .timeline li { display: grid; grid-template-columns: 64px 18px 1fr; gap: 10px; align-items: stretch; }
  .timeline .t { font-variant-numeric: tabular-nums; font-size: 0.9rem; font-weight: 500; padding-top: 1px; text-align: right; }
  .timeline .rail { position: relative; display: flex; justify-content: center; }
  .timeline .rail::before { content: ''; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--border); }
  .timeline li:first-child .rail::before { top: 9px; }
  .timeline li:last-child .rail::before { bottom: calc(100% - 9px); }
  .timeline .dot { position: relative; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid var(--rds-bleu); margin-top: 4px; }
  .timeline li.edge .dot { background: var(--rds-orange); border-color: var(--rds-orange); }
  .timeline .body { padding-bottom: 18px; }
  .timeline .name { font-size: 0.9rem; }
  .timeline .meta { font-size: 0.72rem; color: var(--muted); }

  /* Bar */
  .bar { display: flex; height: 10px; margin: -6px 0 26px; overflow: hidden; background: var(--border); }
  .bar div { height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.7rem; color: var(--muted); margin: -16px 0 28px; }
  .legend i { display: inline-block; width: 9px; height: 9px; margin-right: 5px; vertical-align: -1px; }

  /* Sleep */
  .sleep { border-top: 1px solid var(--border); padding-top: 22px; }
  .sleep .grid2 { margin-bottom: 10px; }
  .sleep-res { font-size: 0.9rem; }
  .sleep-res b { color: var(--rds-orange); font-weight: 600; font-size: 1.1rem; }

  .presets { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 24px; }
  .presets select { width: auto; flex: 1; min-width: 150px; }

  @media (max-width: 560px) {
    .container { padding: 22px 16px; }
    .grid2 { grid-template-columns: 1fr; gap: 18px; }
    .step { grid-template-columns: 22px 1fr 78px 52px; gap: 6px; }
    .step .ctrl .up, .step .ctrl .down { display: none; }
    .result .big { font-size: 2.2rem; }
    .result .side { text-align: left; }
  }
  @media print {
    body { background: #fff; padding: 0; }
    .container { box-shadow: none; }
    .row-actions, .presets, .mode, .icon-btn, .dur-hint { display: none !important; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo-text">Planning <span>|</span> Journée</div>
    <div class="sub">Calcul de l'heure de lever</div>
  </div>

  <div class="mode" role="tablist">
    <button id="modeBack" class="active" type="button">Je dois arriver à… → heure de lever</button>
    <button id="modeFwd" type="button">Je me lève à… → heure d'arrivée</button>
  </div>

  <div class="grid2">
    <div>
      <label class="lbl" id="refLabel" for="refTime">Heure d'arrivée souhaitée</label>
      <input type="time" id="refTime" value="09:00">
    </div>
    <div>
      <label class="lbl" for="margin">Marge de sécurité (min)</label>
      <input type="number" id="margin" min="0" step="5" value="10" inputmode="numeric">
    </div>
  </div>

  <h3>Étapes de la matinée</h3>
  <div class="steps" id="steps"></div>
  <p class="dur-hint">Durée : « 20 », « 36 min », « 1h », « 1h15 » ou « 1:15 ».</p>

  <div class="row-actions">
    <button class="btn primary" id="addStep" type="button">+ Ajouter une étape</button>
    <button class="btn" id="resetSteps" type="button">Réinitialiser</button>
    <button class="btn" id="printBtn" type="button">Imprimer</button>
  </div>

  <div class="presets">
    <select id="presetSelect" aria-label="Plannings enregistrés"></select>
    <button class="btn" id="loadPreset" type="button">Charger</button>
    <button class="btn" id="savePreset" type="button">Enregistrer sous…</button>
    <button class="btn" id="delPreset" type="button">Supprimer</button>
  </div>

  <div class="result">
    <div>
      <div class="cap" id="resCap">Il faut se lever à</div>
      <div class="big" id="resTime">--:--</div>
      <div class="warn" id="resWarn"></div>
    </div>
    <div class="side">
      Durée totale : <b id="resTotal">—</b><br>
      dont préparation : <b id="resPrep">—</b><br>
      dont trajets : <b id="resTravel">—</b>
    </div>
  </div>

  <div class="bar" id="bar"></div>
  <div class="legend" id="legend"></div>

  <h3>Déroulé</h3>
  <ul class="timeline" id="timeline"></ul>

  <div class="sleep">
    <h3>Heure de coucher</h3>
    <div class="grid2">
      <div>
        <label class="lbl" for="sleepHours">Temps de sommeil voulu (h)</label>
        <input type="number" id="sleepHours" min="3" max="12" step="0.5" value="7.5" inputmode="decimal">
      </div>
      <div>
        <label class="lbl" for="fallAsleep">Temps d'endormissement (min)</label>
        <input type="number" id="fallAsleep" min="0" step="5" value="15" inputmode="numeric">
      </div>
    </div>
    <div class="sleep-res">Pour bien dormir, au lit à <b id="bedTime">--:--</b></div>
  </div>
</div>

<script>
(function () {
  const STORE = 'planning-journee-v1';
  const PRESETS = 'planning-journee-presets-v1';
  const COLORS = { prep: '#ff7200', travel: '#25737d', other: '#9aa5a8' };

  const DEFAULT_STEPS = [
    { name: 'Préparation', dur: 20, kind: 'prep' },
    { name: 'Trajet voiture', dur: 36, kind: 'travel' },
    { name: 'Trajet train', dur: 60, kind: 'travel' }
  ];

  const $ = id => document.getElementById(id);
  const safeGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
  const safeSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  let state = Object.assign({
    mode: 'back', ref: '09:00', margin: 10, sleepHours: 7.5, fallAsleep: 15,
    steps: DEFAULT_STEPS.map(s => ({ ...s }))
  }, safeGet(STORE) || {});

  // ---------- Durées ----------
  function parseDur(str) {
    if (typeof str === 'number') return Math.max(0, Math.round(str));
    str = String(str || '').trim().toLowerCase().replace(/\s+/g, '').replace(',', '.');
    if (!str) return 0;
    let m;
    if ((m = str.match(/^(\d+):(\d{1,2})$/))) return +m[1] * 60 + +m[2];
    if ((m = str.match(/^(\d+(?:\.\d+)?)h(?:(\d{1,2})(?:min|mn|m)?)?$/))) return Math.round(+m[1] * 60) + (m[2] ? +m[2] : 0);
    if ((m = str.match(/^(\d+)(?:min|mn|m)?$/))) return +m[1];
    return NaN;
  }
  function fmtDur(min) {
    if (!isFinite(min)) return '—';
    const h = Math.floor(min / 60), m = min % 60;
    if (!h) return m + ' min';
    return h + 'h' + (m ? String(m).padStart(2, '0') : '');
  }
  function guessKind(name) {
    const n = (name || '').toLowerCase();
    if (/trajet|voiture|train|bus|métro|metro|tram|vélo|velo|marche|route|rer|transport|parking/.test(n)) return 'travel';
    if (/prépa|prepa|douche|habill|petit|déj|dej|café|cafe|toilette|maquill|lever/.test(n)) return 'prep';
    return 'other';
  }

  // ---------- Heures ----------
  const toMin = t => { const [h, m] = (t || '00:00').split(':').map(Number); return h * 60 + m; };
  const fmtTime = min => {
    const d = ((Math.round(min) % 1440) + 1440) % 1440;
    return String(Math.floor(d / 60)).padStart(2, '0') + 'h' + String(d % 60).padStart(2, '0');
  };

  // ---------- Rendu des étapes ----------
  function renderSteps() {
    const wrap = $('steps');
    wrap.innerHTML = '';
    state.steps.forEach((s, i) => {
      const row = document.createElement('div');
      row.className = 'step';
      row.innerHTML =
        '<div class="num">' + (i + 1) + '</div>' +
        '<input class="name" type="text" placeholder="Nom de l\'étape" aria-label="Nom de l\'étape">' +
        '<input class="dur" type="text" inputmode="text" placeholder="min" aria-label="Durée">' +
        '<div class="ctrl">' +
          '<button class="icon-btn up" type="button" title="Monter"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
          '<button class="icon-btn down" type="button" title="Descendre"' + (i === state.steps.length - 1 ? ' disabled' : '') + '>↓</button>' +
          '<button class="icon-btn del" type="button" title="Supprimer">✕</button>' +
        '</div>';
      const nameI = row.querySelector('.name'), durI = row.querySelector('.dur');
      nameI.value = s.name;
      durI.value = fmtDur(s.dur);
      nameI.addEventListener('input', () => { s.name = nameI.value; s.kind = guessKind(s.name); update(); });
      durI.addEventListener('input', () => {
        const v = parseDur(durI.value);
        durI.style.borderBottomColor = isNaN(v) ? '#e53935' : '';
        if (!isNaN(v)) { s.dur = v; update(); }
      });
      durI.addEventListener('blur', () => { durI.value = fmtDur(s.dur); durI.style.borderBottomColor = ''; });
      row.querySelector('.up').onclick = () => move(i, -1);
      row.querySelector('.down').onclick = () => move(i, 1);
      row.querySelector('.del').onclick = () => { state.steps.splice(i, 1); renderSteps(); update(); };
      wrap.appendChild(row);
    });
  }
  function move(i, d) {
    const j = i + d;
    if (j < 0 || j >= state.steps.length) return;
    [state.steps[i], state.steps[j]] = [state.steps[j], state.steps[i]];
    renderSteps(); update();
  }

  // ---------- Calcul ----------
  function update() {
    const margin = Math.max(0, parseInt($('margin').value, 10) || 0);
    state.margin = margin;
    state.ref = $('refTime').value || '00:00';
    state.sleepHours = parseFloat($('sleepHours').value) || 0;
    state.fallAsleep = Math.max(0, parseInt($('fallAsleep').value, 10) || 0);

    const items = state.steps.map(s => ({ name: s.name || 'Étape', dur: s.dur || 0, kind: s.kind || guessKind(s.name) }));
    if (margin > 0) items.push({ name: 'Marge de sécurité', dur: margin, kind: 'other' });

    const total = items.reduce((a, s) => a + s.dur, 0);
    const prep = items.filter(s => s.kind === 'prep').reduce((a, s) => a + s.dur, 0);
    const travel = items.filter(s => s.kind === 'travel').reduce((a, s) => a + s.dur, 0);

    const ref = toMin(state.ref);
    const wake = state.mode === 'back' ? ref - total : ref;
    const arrive = wake + total;

    $('resCap').textContent = state.mode === 'back' ? 'Il faut se lever à' : 'Arrivée prévue à';
    $('resTime').textContent = fmtTime(state.mode === 'back' ? wake : arrive);
    $('resWarn').textContent = state.mode === 'back'
      ? (wake < 0 ? 'Attention : lever la veille !' : '')
      : (arrive >= 1440 ? 'Arrivée le lendemain' : '');
    $('resTotal').textContent = fmtDur(total);
    $('resPrep').textContent = fmtDur(prep);
    $('resTravel').textContent = fmtDur(travel);

    // Timeline
    const tl = $('timeline');
    tl.innerHTML = '';
    let t = wake;
    const add = (time, name, meta, edge) => {
      const li = document.createElement('li');
      if (edge) li.className = 'edge';
      li.innerHTML = '<div class="t"></div><div class="rail"><div class="dot"></div></div><div class="body"><div class="name"></div><div class="meta"></div></div>';
      li.querySelector('.t').textContent = fmtTime(time);
      li.querySelector('.name').textContent = name;
      li.querySelector('.meta').textContent = meta || '';
      tl.appendChild(li);
    };
    add(t, 'Lever', 'Réveil', true);
    items.forEach(s => {
      add(t, s.name, fmtDur(s.dur) + ' → jusqu\'à ' + fmtTime(t + s.dur));
      t += s.dur;
    });
    add(t, 'Arrivée', '', true);

    // Barre
    const bar = $('bar'), legend = $('legend');
    bar.innerHTML = ''; legend.innerHTML = '';
    if (total > 0) {
      items.forEach((s, i) => {
        const d = document.createElement('div');
        d.style.width = (s.dur / total * 100) + '%';
        d.style.background = COLORS[s.kind];
        d.style.opacity = s.kind === 'other' ? 1 : (1 - (i % 2) * 0.25);
        d.title = s.name + ' — ' + fmtDur(s.dur);
        bar.appendChild(d);
      });
      [['prep', 'Préparation'], ['travel', 'Trajets'], ['other', 'Autre / marge']].forEach(([k, l]) => {
        if (!items.some(s => s.kind === k)) return;
        const sp = document.createElement('span');
        sp.innerHTML = '<i style="background:' + COLORS[k] + '"></i>' + l;
        legend.appendChild(sp);
      });
    }

    // Coucher
    const bed = wake - Math.round(state.sleepHours * 60) - state.fallAsleep;
    $('bedTime').textContent = fmtTime(bed);

    safeSet(STORE, state);
  }

  // ---------- Mode ----------
  function setMode(m) {
    state.mode = m;
    $('modeBack').classList.toggle('active', m === 'back');
    $('modeFwd').classList.toggle('active', m === 'fwd');
    $('refLabel').textContent = m === 'back' ? 'Heure d\'arrivée souhaitée' : 'Heure de lever';
    update();
  }
  $('modeBack').onclick = () => {
    if (state.mode === 'back') return;
    // convertit l'heure de lever actuelle en heure d'arrivée pour rester cohérent
    $('refTime').value = fmtTime(toMin($('refTime').value) + totalNow()).replace('h', ':');
    setMode('back');
  };
  $('modeFwd').onclick = () => {
    if (state.mode === 'fwd') return;
    $('refTime').value = fmtTime(toMin($('refTime').value) - totalNow()).replace('h', ':');
    setMode('fwd');
  };
  function totalNow() { return state.steps.reduce((a, s) => a + (s.dur || 0), 0) + state.margin; }

  // ---------- Actions ----------
  $('addStep').onclick = () => {
    state.steps.push({ name: '', dur: 10, kind: 'other' });
    renderSteps(); update();
    const names = document.querySelectorAll('#steps .name');
    names[names.length - 1].focus();
  };
  $('resetSteps').onclick = () => {
    if (!confirm('Revenir aux étapes par défaut ?')) return;
    state.steps = DEFAULT_STEPS.map(s => ({ ...s }));
    renderSteps(); update();
  };
  $('printBtn').onclick = () => window.print();
  ['refTime', 'margin', 'sleepHours', 'fallAsleep'].forEach(id => $(id).addEventListener('input', update));

  // ---------- Plannings enregistrés ----------
  function presets() { return safeGet(PRESETS) || {}; }
  function renderPresets() {
    const sel = $('presetSelect'), p = presets(), names = Object.keys(p).sort();
    sel.innerHTML = names.length ? '' : '<option value="">Aucun planning enregistré</option>';
    names.forEach(n => { const o = document.createElement('option'); o.value = o.textContent = n; sel.appendChild(o); });
  }
  $('savePreset').onclick = () => {
    const name = prompt('Nom du planning (ex. « Bureau Paris », « Télétravail ») :');
    if (!name) return;
    const p = presets();
    p[name.trim()] = { mode: state.mode, ref: state.ref, margin: state.margin, steps: state.steps.map(s => ({ ...s })) };
    safeSet(PRESETS, p); renderPresets(); $('presetSelect').value = name.trim();
  };
  $('loadPreset').onclick = () => {
    const p = presets()[$('presetSelect').value];
    if (!p) return;
    state.steps = p.steps.map(s => ({ ...s }));
    $('refTime').value = p.ref; $('margin').value = p.margin;
    renderSteps(); setMode(p.mode);
  };
  $('delPreset').onclick = () => {
    const n = $('presetSelect').value, p = presets();
    if (!n || !p[n] || !confirm('Supprimer « ' + n + ' » ?')) return;
    delete p[n]; safeSet(PRESETS, p); renderPresets();
  };

  // ---------- Init ----------
  $('refTime').value = state.ref;
  $('margin').value = state.margin;
  $('sleepHours').value = state.sleepHours;
  $('fallAsleep').value = state.fallAsleep;
  renderSteps(); renderPresets(); setMode(state.mode);
})();
</script>
</body>
</html>
