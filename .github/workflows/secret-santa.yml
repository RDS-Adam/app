# Secret Santa — tirage au sort et envoi à chaque salarié de la personne à qui offrir son cadeau.
# Lancement manuel uniquement : onglet Actions → « Secret Santa » → Run workflow.
# Participants : les salariés de data.json (onglet Équipe de l'app Congés). Le tirage n'est écrit nulle part.
# Utilise les mêmes secrets que les notifications de congés : MAIL_USER et MAIL_PASS.
name: Secret Santa

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'simulation = vérifie sans rien envoyer · envoi = envoie les emails'
        type: choice
        options:
          - simulation
          - envoi
        default: simulation
      budget:
        description: 'Budget à indiquer dans l''email (optionnel, ex. 15 € maximum)'
        required: false
      date:
        description: 'Date de remise des cadeaux (optionnel, ex. vendredi 18 décembre)'
        required: false
      uniquement:
        description: 'Renvoyer à une seule personne : son prénom (laisser vide pour tout le monde)'
        required: false

concurrency:
  group: secret-santa
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer nodemailer
        run: npm install --no-save --no-package-lock --no-audit --no-fund nodemailer@6
      - name: Tirage au sort et envoi
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          SENDER_NAME: Secret Santa — Rue du Store
          DRY_RUN: ${{ inputs.mode == 'envoi' && '0' || '1' }}
          BUDGET: ${{ inputs.budget }}
          EVENT_DATE: ${{ inputs.date }}
          ONLY: ${{ inputs.uniquement }}
        run: node .github/scripts/secret-santa.mjs
