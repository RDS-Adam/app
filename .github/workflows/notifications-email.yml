# Envoi des emails de notification — Congés RH
# Se déclenche à chaque sauvegarde de data.json par l'application (commit "Update RH").
# Lit les notifications ajoutées depuis le commit précédent et les envoie par email depuis un compte Gmail.
#
# Secrets à créer dans GitHub → Settings → Secrets and variables → Actions → New repository secret :
#   MAIL_USER  adresse Gmail dédiée (ex. rds.conges@gmail.com)
#   MAIL_PASS  mot de passe d'application Google (16 caractères), PAS le mot de passe du compte
name: Notifications email

on:
  push:
    paths:
      - 'data.json'
      - 'data-test.json'
  workflow_dispatch:
    inputs:
      since:
        description: "Renvoyer les notifications ajoutées depuis ce commit (SHA). Vide = dernier commit seulement."
        required: false
        default: ''
      max_age_hours:
        description: "Âge maximum des notifications à envoyer, en heures (6 par défaut)."
        required: false
        default: '6'

# Pas de bloc « concurrency » : GitHub n'y garde qu'UNE exécution en attente et annule les autres,
# si bien que plusieurs validations enchaînées en quelques secondes perdaient leurs emails.
# Chaque exécution ne traite que les notifications de son propre push : elles peuvent tourner en parallèle.

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # le script récupère lui-même le commit de référence s'il manque
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer nodemailer
        run: npm install --no-save --no-package-lock --no-audit --no-fund nodemailer@6
      - name: Envoyer les nouvelles notifications (production)
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          SENDER_NAME: Congés RH — Rue du Store
          DATA_FILE: data.json
          BASE_SHA: ${{ github.event.before || inputs.since }}
          MAX_AGE_HOURS: ${{ inputs.max_age_hours || '6' }}
        run: node .github/scripts/send-notifications.mjs
      - name: Envoyer les nouvelles notifications (environnement de test)
        if: always()
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          SENDER_NAME: '[TEST] Congés RH'
          DATA_FILE: data-test.json
          SUBJECT_PREFIX: '[TEST] '
          BASE_SHA: ${{ github.event.before || inputs.since }}
          MAX_AGE_HOURS: ${{ inputs.max_age_hours || '6' }}
        run: node .github/scripts/send-notifications.mjs
